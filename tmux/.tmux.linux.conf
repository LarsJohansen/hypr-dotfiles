# Linux-only half of .tmux.conf, sourced from there. Needs flock and GNU stat.

# poller-health: #() shell substitution renders empty in window-status-format
# (verified), so a dead poller can only be surfaced here. Cheap on purpose --
# one stat + one date, no scan -- since status-interval reruns it every 5s.
# Reads the heartbeat wt-poll writes each loop tick, keyed to this server's
# pid the same way as the flock lockfile below.
# %% not %: status-right is passed through strftime(3) before #() runs, so a
# bare %Y/%s here gets silently replaced with the real year/epoch first,
# turning `stat -c %Y` into `stat -c 2026` (verified broken); %% is the
# strftime escape for a literal '%'.
set -g status-right '#{?@wt_usage,#[fg=#8bd5ca]#{@wt_usage}#[default]  ,}#(h=/tmp/wt-poll.#{USER}.#{pid}.heartbeat; m=$(stat -c %%Y "$h" 2>/dev/null) || m=0; [ $(( $(date +%%s) - m )) -lt 15 ] || printf %%s "#[fg=#ed8796]#[bold]poll-dead#[default]  ")#[fg=#a5adcb]#(date +%H:%M\ %d-%b)#[default]'

# flock keeps `prefix r` from starting a second poller; the loser exits 1.
# Keyed to the server pid (not just $USER): a killed server's poller can
# outlive it by up to WT_POLL_INTERVAL, and a global lockfile name would let
# that dying poller win the flock race against the new server started in
# that window, leaving no poller running. Per-pid also stops two servers on
# different sockets from fighting over one lockfile.
# `|| true`: flock -n exits 1 when the lock is already held, which is the
# normal "a poller is already running for this server" case on every config
# reload. tmux surfaces any non-zero run-shell exit as an error in the
# terminal, so swallow it — losing the race is success, not failure.
run-shell -b 'flock -n /tmp/wt-poll.#{USER}.#{pid}.lock ~/.local/bin/wt-poll || true'

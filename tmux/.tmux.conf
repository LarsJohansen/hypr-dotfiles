### --- TPM Plugin Manager --- ###
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-restore sessions on tmux start
set -g @continuum-restore 'on'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

### --- General Settings --- ###
set -g mouse on
set -g history-limit 10000
setw -g mode-keys vi
set -s set-clipboard on

# Clipboard integration (platform-specific)
if-shell "uname | grep -q Darwin" \
  "set -g update-environment 'DISPLAY SSH_AUTH_SOCK SSH_ASKPASS'; \
   bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'; \
   bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "set -g update-environment 'DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR SSH_AUTH_SOCK SSH_ASKPASS'"

### --- Copy Mode (Vi Style) --- ###
bind-key Enter copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# vim-tmux-navigator: copy mode navigation
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

### --- Easier Pane Navigation --- ###
# Smart navigation with vim-tmux-navigator plugin
# Works seamlessly between tmux panes and vim/nvim windows
# Use explicit /usr/bin/grep to avoid ripgrep alias
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | /usr/bin/grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

# macOS: Ctrl+hjkl with vim-tmux-navigator
# Linux: Alt+hjkl (M- prefix)
if-shell "uname | grep -q Darwin" \
  "bind-key -n C-h if-shell \"$is_vim\" 'send-keys C-h' 'select-pane -L'; \
   bind-key -n C-j if-shell \"$is_vim\" 'send-keys C-j' 'select-pane -D'; \
   bind-key -n C-k if-shell \"$is_vim\" 'send-keys C-k' 'select-pane -U'; \
   bind-key -n C-l if-shell \"$is_vim\" 'send-keys C-l' 'select-pane -R'; \
   bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\' 'select-pane -l'" \
  "bind -n M-h select-pane -L; \
   bind -n M-j select-pane -D; \
   bind -n M-k select-pane -U; \
   bind -n M-l select-pane -R"

### --- Sensible Splits --- ###
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

### --- Reload Config --- ###
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

### --- Status Bar Minimalism --- ###
set -g status-interval 5
set -g status-justify centre
set -g status-bg colour235
set -g status-fg colour250
set -g status-left-length 60
set -g status-left '#[fg=colour39,bold]#S'
set -g status-right '#[fg=colour246]#(date +%H:%M\ %d-%b)'

### --- Optional: Aggressive Resize Sync --- ###
# set -g aggressive-resize on

set -g default-terminal "tmux-256color"

set -as terminal-features ',xterm-256color:RGB'

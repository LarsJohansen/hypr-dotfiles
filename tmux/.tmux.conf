### --- TPM Plugin Manager --- ###
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-restore sessions on tmux start
set -g @continuum-restore 'on'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

### --- General Settings --- ###
set -g mouse on
set -g history-limit 10000
setw -g mode-keys vi
set -s set-clipboard on

# Ensure Wayland clipboard tools work inside tmux
set -g update-environment "DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR SSH_AUTH_SOCK SSH_ASKPASS"


### --- Copy Mode (Vi Style) --- ###
bind-key Enter copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

### --- Easier Pane Navigation (Ctrl + hjkl) --- ###
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

### --- Sensible Splits --- ###
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

### --- Reload Config --- ###
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

### --- Status Bar Minimalism --- ###
set -g status-interval 5
set -g status-justify centre
set -g status-bg default
set -g status-fg cyan
set -g status-left-length 60
set -g status-left '#S'
# poller-health: #() shell substitution renders empty in window-status-format
# (verified), so a dead poller can only be surfaced here. Cheap on purpose --
# one stat + one date, no scan -- since status-interval reruns it every 5s.
# Reads the heartbeat wt-poll writes each loop tick, keyed to this server's
# pid the same way as the flock lockfile below.
# %% not %: status-right is passed through strftime(3) before #() runs, so a
# bare %Y/%s here gets silently replaced with the real year/epoch first,
# turning `stat -c %Y` into `stat -c 2026` (verified broken); %% is the
# strftime escape for a literal '%'.
set -g status-right '#{?@wt_usage,#[fg=magenta]#{@wt_usage}#[default]  ,}#(h=/tmp/wt-poll.#{USER}.#{pid}.heartbeat; m=$(stat -c %%Y "$h" 2>/dev/null) || m=0; [ $(( $(date +%%s) - m )) -lt 15 ] || printf %%s "#[fg=red]poll-dead#[default]  ")#(date +%H:%M\ %d-%b)'

### --- Optional: Aggressive Resize Sync --- ###
set -g aggressive-resize on

set -g default-terminal "tmux-256color"

set -as terminal-features ',xterm-256color:RGB'

### --- Claude worktrees (wt) --- ###
bind w run-shell 'wt menu'
bind W command-prompt -p "branch:" 'run-shell "wt new %%"'
bind x run-shell 'wt close'
# Looking at the window is what clears the flag: ● means "unseen".
# pane-focus-in fires on OS-level terminal focus, not tmux window switches,
# so it never clears here. session-window-changed fires on every switch path
# (select-window, next/previous/last-window) and targets the window being
# switched TO.
set-hook -g session-window-changed 'if -F "#{==:#{@cc_state},attention}" "set -w @cc_state idle"'

# Absence is the quiet state; every glyph means something needs reading.
set -g window-status-format '#I:#W#{?#{==:#{@cc_state},busy},#[fg=yellow] ◐#{@cc_elapsed},}#{?#{==:#{@cc_state},attention},#[fg=red] ●,}#{?@wt_git, #[fg=blue]#{@wt_git},}#[default]'
set -g window-status-current-format '#[fg=cyan,bold]#I:#W#[default]#{?#{==:#{@cc_state},busy},#[fg=yellow] ◐#{@cc_elapsed},}#{?#{==:#{@cc_state},attention},#[fg=red] ●,}#{?@wt_git, #[fg=blue,nobold]#{@wt_git},}#[default]'

# flock keeps `prefix r` from starting a second poller; the loser exits 1.
# Keyed to the server pid (not just $USER): a killed server's poller can
# outlive it by up to WT_POLL_INTERVAL, and a global lockfile name would let
# that dying poller win the flock race against the new server started in
# that window, leaving no poller running. Per-pid also stops two servers on
# different sockets from fighting over one lockfile.
run-shell -b 'flock -n /tmp/wt-poll.#{USER}.#{pid}.lock ~/.local/bin/wt-poll'
